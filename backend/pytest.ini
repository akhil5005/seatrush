[pytest]
# asyncio_mode=auto: every `async def test_*` is run by pytest-asyncio without
# needing an @pytest.mark.asyncio decorator on each one.
asyncio_mode = auto
# Async fixtures get a per-test event loop, which is what keeps each asyncpg
# pool bound to the loop that actually uses it (see tests/conftest.py).
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -q --strict-markers
