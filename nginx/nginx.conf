# ===========================================================================
#  SeatRush -- Nginx gateway
#
#  Nginx is the only thing the browser ever talks to. It is, in one process:
#    * the static web server for the React build (with SPA fallback)
#    * the reverse proxy and round-robin load balancer for api1/api2/api3
#    * the failover mechanism when a replica dies
#    * the rate limiter (per IP, per login, per logged-in token)
#    * the microcache that absorbs seat-map polling
#    * the TLS terminator
#    * the structured request log the ops dashboard reads
#
#  Read it top to bottom. Every directive group says WHAT it does, WHY SeatRush
#  needs it, and WHAT BREAKS without it. Proof commands for each are in
#  docs/NGINX.md.
# ===========================================================================

# One master process (reads the config, binds the ports, owns the workers) and
# one worker per CPU core. `auto` resolves to the core count at startup.
#
# A worker is single-threaded and event-driven: it never blocks on a socket.
# Instead of a thread per connection, one worker holds thousands of sockets in
# an epoll set and is woken only for the ones with data ready. That is why a
# single worker can carry ~10k idle connections on a few MB of RAM -- and why
# the worker must never be given a blocking task (no PHP in-process, no DNS
# lookups mid-request). All the slow work here happens in the Python backends.
worker_processes auto;

# Container convention: logs go to the container's stderr so `docker compose
# logs nginx` works. This cannot be left to the default, because we mount a
# named volume over /var/log/nginx, which destroys the official image's
# access.log -> /dev/stdout and error.log -> /dev/stderr symlinks.
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    # Max simultaneous connections PER WORKER. Total ceiling is
    # worker_processes x worker_connections. Note a proxied request costs TWO
    # slots: one browser<->Nginx and one Nginx<->backend. So 1024 here is
    # really ~512 concurrent proxied requests per worker, which is far more
    # than three uvicorn replicas can absorb anyway.
    #
    # WHAT BREAKS WITHOUT ENOUGH: Nginx logs "worker_connections are not
    # enough" and drops connections -- visible as a rising `accepts - handled`
    # gap on /nginx_status.
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise "nginx/1.27.x" in the Server header or on error pages.
    # Free reconnaissance for anyone scanning for a version with a known CVE.
    server_tokens off;

    # ---------------------------------------------------------------------
    # Static-file delivery efficiency
    # ---------------------------------------------------------------------
    # sendfile: copy a file straight from the page cache to the socket inside
    #   the kernel. No read() into a user-space buffer, no write() back out.
    #   Matters because every page load serves the JS bundle and the CSS.
    sendfile   on;
    # tcp_nopush (TCP_CORK): with sendfile on, hold back partial packets so the
    #   response headers and the first chunk of the file leave in ONE full
    #   packet instead of a tiny header packet followed by data.
    tcp_nopush on;
    # tcp_nodelay: disable Nagle's algorithm on keepalive connections, so a
    #   small response (a 200-byte JSON seat map) is sent immediately instead
    #   of waiting to be coalesced with the next write. The two look
    #   contradictory but apply at different moments; Nginx manages the switch.
    tcp_nodelay on;

    # Keep the browser's TCP+TLS connection open for 65s of idleness. A seat-map
    # page polls every 2.5s, so without this every poll would pay a TCP
    # handshake AND a TLS handshake (~2 extra round trips). 65 > the 60s that
    # most load balancers use, so we are not the side that closes first.
    keepalive_timeout 65;

    # ---------------------------------------------------------------------
    # Request size and slow-client hygiene
    # ---------------------------------------------------------------------
    # This app has NO uploads. The biggest legitimate request body is a hold
    # with 6 seat ids -- about 80 bytes. 64k is already absurdly generous, and
    # anything larger is rejected with 413 AT THE EDGE: the bytes never reach
    # a Python process and never occupy a uvicorn worker.
    client_max_body_size 64k;

    # Slowloris protection. A client that opens a connection, sends one byte of
    # header per second and never finishes would otherwise hold a worker
    # connection slot indefinitely; a few thousand of those exhaust
    # worker_connections and the site is down without any bandwidth being used.
    # These two put a hard clock on "sending me your request".
    client_header_timeout 10s;
    client_body_timeout   10s;
    # Buffer sizes for the request line + headers. A JWT in an Authorization
    # header is long, so the default 8k can be tight once cookies are added.
    client_header_buffer_size   4k;
    large_client_header_buffers 4 16k;

    # ---------------------------------------------------------------------
    # Structured access log
    # ---------------------------------------------------------------------
    # `escape=json` is mandatory, not cosmetic: it escapes quotes, backslashes
    # and control characters inside variables. Without it, a User-Agent
    # containing a double quote produces a line that is not valid JSON, and the
    # ops dashboard's json.loads() silently drops that request from the view.
    #
    # The upstream_* fields are deliberately quoted as STRINGS. After a retry
    # Nginx writes a comma-separated list -- upstream_addr can be
    # "172.18.0.4:8000, 172.18.0.5:8000" and upstream_status "502, 200".
    # Declaring them as numbers is a bug that only appears during a failover,
    # i.e. exactly when you are reading the log.
    log_format json_combined escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"request_method":"$request_method",'
          '"request_uri":"$request_uri",'
          '"status":$status,'
          '"request_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_response_time":"$upstream_response_time",'
          '"upstream_cache_status":"$upstream_cache_status",'
          '"body_bytes_sent":$body_bytes_sent,'
          '"http_user_agent":"$http_user_agent"'
        '}';

    # Written to a named volume that Nginx mounts read-write and the API
    # containers mount READ-ONLY, so GET /api/ops/logs can tail it. Exactly one
    # writer, no locking needed. `buffer=` batches writes so a flash sale does
    # not turn into one write(2) syscall per request; `flush=1s` bounds how
    # stale the ops dashboard can be.
    access_log /var/log/nginx/access.json.log json_combined buffer=32k flush=1s;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    # The seat map for a 10x20 venue is ~12 KB of very repetitive JSON and it is
    # re-fetched every 2.5 seconds by every open tab. gzip takes it to ~1 KB.
    # On a flash sale with 1,000 viewers that is the difference between ~5 MB/s
    # and ~0.4 MB/s of egress.
    gzip              on;
    # 5 is the knee of the curve: nearly level-9 ratio at a fraction of the CPU.
    gzip_comp_level   5;
    # Below ~256 bytes the gzip header costs more than it saves.
    gzip_min_length   256;
    # Compress what proxied responses return too, not just static files.
    # `any` because our backends do not send Cache-Control/Expires hints.
    gzip_proxied      any;
    # text/html is always compressed and must not be listed again.
    gzip_types        application/json application/javascript text/javascript
                      text/css text/plain text/xml application/xml
                      image/svg+xml application/manifest+json;
    # Adds `Vary: Accept-Encoding`, so a shared cache (ours, or a CDN later)
    # never serves a gzipped body to a client that cannot decompress it.
    gzip_vary         on;

    # ---------------------------------------------------------------------
    # HSTS only over TLS  (see snippets/security-headers.conf)
    # ---------------------------------------------------------------------
    # Nginx skips an add_header whose value resolves to an empty string, so
    # this map lets ONE shared security-headers snippet be included in both the
    # HTTP and the HTTPS server block while emitting HSTS only on HTTPS.
    map $scheme $hsts_header {
        default "";
        https   "max-age=300";
    }

    # =====================================================================
    # RATE LIMITING  --  the leaky bucket
    # =====================================================================
    # Mental model: each key (an IP, a token) gets a bucket that drains at a
    # constant `rate`. Every request adds one drop.
    #   rate   -- the sustained speed allowed, long term.
    #   burst  -- how many extra drops may sit in the bucket at once, i.e. the
    #             size of a short waiting room for a spike.
    #   nodelay-- serve those queued drops IMMEDIATELY instead of spacing them
    #             out at `rate`. Without nodelay, a burst of 40 at 20r/s means
    #             the 40th request waits ~2s before being proxied -- a user
    #             staring at a frozen page. With nodelay they all go through at
    #             once and the bucket then refuses new requests until it has
    #             drained. For an interactive flash sale, nodelay is right:
    #             fast-and-sometimes-429 beats uniformly-slow.
    # Over the limit -> 429, below it -> proxied. Nothing is queued forever.
    #
    # Memory: each zone stores ~64 bytes per tracked key. 10m holds ~160k keys,
    # far more than a demo (or a small production) ever needs.

    # General API ceiling, per client IP. $binary_remote_addr (4 bytes for
    # IPv4) rather than $remote_addr (up to 15 bytes of text) purely to fit
    # more keys in the same shared memory.
    limit_req_zone $binary_remote_addr zone=api_ip:10m   rate=20r/s;

    # Login/signup brute-force protection: 5 attempts PER MINUTE per IP.
    # Note r/m, not r/s -- three orders of magnitude stricter than the general
    # API limit, because a password guess is cheap for the attacker and
    # expensive for us (every attempt costs a ~50 ms scrypt hash).
    limit_req_zone $binary_remote_addr zone=auth_ip:10m  rate=5r/m;

    # Per-LOGGED-IN-USER booking limit. The key is the whole Authorization
    # header, so each JWT gets its own bucket. This is the limit that matters
    # during a flash sale: a per-IP limit is useless when 400 students share
    # one college NAT, and too loose when one user scripts 50 hold attempts
    # from one laptop. Per-token gets both cases right.
    #
    # A request with NO Authorization header produces an EMPTY key, and Nginx
    # does not count empty keys in a zone at all -- that entry is simply
    # skipped. So anonymous traffic slips past this zone, which is why the
    # booking locations ALSO apply api_ip, and why the backend rejects an
    # unauthenticated POST /api/holds with 401 regardless.
    #
    # (The key is a few hundred bytes of JWT, so this zone holds ~25k distinct
    # tokens rather than 160k. Still ample. A production system would key on a
    # short user id extracted at the edge -- see the auth_request stretch goal.)
    limit_req_zone $http_authorization zone=booking_user:10m rate=2r/s;

    # Concurrent (not per-second) connections per IP. Stops one client from
    # opening hundreds of sockets and sitting on them -- each one costs a
    # worker_connections slot whether or not it is sending anything.
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;

    # Both default to 503, which is a lie: 503 means "the server is broken",
    # 429 means "you are going too fast, and here is how long to wait".
    # A client library retries a 429 sensibly and gives up on a 503.
    limit_req_status  429;
    limit_conn_status 429;

    # Log a rejected request at `warn`, not the default `error`: being
    # rate-limited is expected behaviour during a flash sale, and burying the
    # real errors under thousands of 429 lines is how you miss an outage.
    limit_req_log_level warn;

    # =====================================================================
    # MICROCACHE
    # =====================================================================
    # THE PROBLEM IT SOLVES
    #   Every open seat-map tab polls GET /api/events/{id}/seats every ~2.5 s.
    #   1,000 people watching one event = ~400 requests/second, all asking the
    #   identical question and all hitting Postgres. Three uvicorn replicas
    #   would spend their entire capacity answering a question whose answer
    #   barely changes.
    #
    # THE FIX
    #   Cache that answer for ONE SECOND. 400 req/s collapses to ~1 req/s per
    #   event reaching a backend -- a 400x reduction -- and the users still see
    #   a map that is at most 1 s old.
    #
    # WHY 1 SECOND OF STALENESS IS SAFE HERE
    #   Because the seat map is only ever a HINT. Seat ownership is decided
    #   exclusively by the conditional UPDATE in Postgres (backend/app/holds.py).
    #   The worst case is: a user sees a seat as free, clicks it, and gets a
    #   clean 409 seat_taken with the conflicting seat highlighted. That is a
    #   normal, handled outcome -- not a correctness failure. We traded one
    #   second of visual freshness for a 400x capacity win, and the invariant
    #   "never two owners for one seat" was never involved.
    #
    # WHY THESE ENDPOINTS AND NO OTHERS
    #   The default cache key is $scheme$proxy_host$request_uri -- it does NOT
    #   include the Authorization header. So a cached response is served to
    #   whoever asks for that URL next. That is only safe for responses that
    #   do not depend on the caller. /api/events* qualifies by design: no auth
    #   is read and the seat map never says WHO holds a seat. /api/bookings,
    #   /api/holds, /api/auth, /api/admin and /api/ops all fail that test and
    #   are never cached. (Nginx also refuses to cache any response carrying
    #   Set-Cookie, which is a useful second safety net -- but we do not rely
    #   on it, because this API is JWT-based and sets no cookies at all.)
    #
    # levels=1:2      -> spread cache files over two directory levels so no
    #                    single directory holds 100k files
    # keys_zone       -> 10 MB of shared memory for the key index (~80k keys)
    # max_size=100m   -> disk ceiling; the cache manager evicts LRU past it
    # inactive=10m    -> drop entries nobody asked for in 10 minutes
    # use_temp_path=off -> write cache files straight into the cache directory
    #                    instead of staging them elsewhere and then rename()ing
    #                    across filesystems. Avoids a pointless copy.
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api_cache:10m
                     max_size=100m
                     inactive=10m
                     use_temp_path=off;

    # =====================================================================
    # UPSTREAM  --  load balancing and failover
    # =====================================================================
    upstream api_backend {
        # *** SHARED LOAD-BALANCER STATE -- NOT OPTIONAL WITH MULTIPLE WORKERS ***
        # Without this line, the round-robin counter and the max_fails failure
        # counters live in each WORKER's private memory. With worker_processes
        # auto on a 12-core laptop that means 12 independent counters, each
        # starting at api1 -- so 12 separate browser connections all get sent
        # to api1 and the load balancing looks completely broken. (Measured
        # exactly that while building this: 9 curl requests, 9 x api1. On a
        # single reused keepalive connection -- one worker -- the same config
        # correctly cycled api3, api1, api2.)
        #
        # `zone` moves that state into 64 KB of shared memory, so all workers
        # advance ONE counter and agree on which servers are currently failed.
        # The second half matters just as much: without it, worker 7 marking
        # api2 as down teaches the other 11 workers nothing.
        zone api_backend 64k;

        # Default algorithm is ROUND ROBIN: request 1 -> api1, 2 -> api2,
        # 3 -> api3, 4 -> api1 ... No configuration line needed, which is why
        # there is no `round_robin;` directive to see here.
        #
        # SeatRush needs NO STICKY SESSIONS, which is what makes plain round
        # robin correct. The replicas are stateless: auth is a self-contained
        # JWT verified with a shared secret, and every piece of mutable state
        # (seats, holds, bookings, idempotency keys) lives in Postgres. Any
        # replica can serve any request from any user at any time. If we had
        # kept sessions in process memory we would be forced onto ip_hash, and
        # then one NATed office would pin hundreds of users to one replica.
        #
        # ALTERNATIVES (commented, not dead code -- these are the real choices):
        # least_conn;   # route to the replica with the fewest active requests.
        #               # Better when request cost varies a lot (some requests
        #               # take 10ms, some 2s), because round robin would keep
        #               # feeding a replica that is already stuck on slow work.
        #               # Our requests are uniformly fast, so it buys nothing.
        # ip_hash;      # same client IP always lands on the same replica.
        #               # The tool for sticky sessions -- and the thing you are
        #               # forced into by stateful backends. Costs you even load
        #               # distribution and makes a replica restart drop that
        #               # slice of users' sessions.

        # PASSIVE health checking -- the only kind open-source Nginx has.
        # There is NO active prober here: Nginx never calls /api/health on its
        # own (the `health_check` directive is an Nginx Plus feature). Instead
        # it judges a server by how REAL traffic to it behaves:
        #   max_fails=2      -> after 2 failed attempts within fail_timeout...
        #   fail_timeout=10s -> ...mark it unavailable for 10s, then let ONE
        #                       request through to see if it recovered.
        # Consequence to be honest about: the FIRST request after a replica
        # dies is the one that discovers it. That request is not lost --
        # proxy_next_upstream below retries it on a healthy replica -- but the
        # user pays the ~3 s connect timeout (or ~0 s with "connection
        # refused", which is what `docker stop` produces). This is also why the
        # app ships its own active prober at GET /api/ops/cluster.
        server api1:8000 max_fails=2 fail_timeout=10s;
        server api2:8000 max_fails=2 fail_timeout=10s;
        server api3:8000 max_fails=2 fail_timeout=10s;

        # Keep up to 32 IDLE connections to the upstreams cached per worker, so
        # a proxied request usually costs zero TCP handshakes. Requires
        # proxy_http_version 1.1 + an empty Connection header -- see
        # snippets/proxy-headers.conf, without which this line does nothing.
        # Note: this is an idle-connection CACHE size, not a connection limit.
        keepalive 32;
        # Recycle a pooled connection after 1000 requests / 60s idle so a
        # long-lived socket to a restarted backend cannot go stale.
        keepalive_requests 1000;
        keepalive_timeout  60s;
    }

    # =====================================================================
    # RETRY POLICY  --  deliberately conservative
    # =====================================================================
    # Set once at http level and inherited by every proxy location.
    #
    # WHAT WE RETRY: a connection error, a timeout, and 502/503/504 -- all
    # cases where the request demonstrably did NOT get processed. Retrying
    # those is free correctness: the user never sees that api2 died.
    #
    # WHAT WE DO NOT RETRY, AND WHY:
    #   * http_500 is absent on purpose. A 500 means the request REACHED the
    #     application and the application blew up *after* possibly committing
    #     a booking. Replaying it on another replica could produce a second
    #     booking. An honest 500 to one user beats a silent double-book.
    #   * `non_idempotent` is absent, which is the important one. By default
    #     Nginx will NOT retry a POST/LOCK/PATCH even on a timeout -- it only
    #     retries requests it considers safe to replay. Adding
    #     `non_idempotent` to this list would tell it to retry POSTs too, and
    #     a timed-out-but-actually-succeeded POST /api/holds/{id}/confirm would
    #     then be sent again: two bookings, one payment. We never add it.
    #     The app's Idempotency-Key layer handles the duplicates Nginx cannot
    #     prevent (the user's own double-click); Nginx's job is simply not to
    #     manufacture new ones.
    proxy_next_upstream         error timeout http_502 http_503 http_504;
    # At most 3 attempts total (the original plus 2 more) -- bounded so one
    # request cannot walk the entire upstream list and multiply the latency.
    proxy_next_upstream_tries   3;
    # And at most 5s spent across all attempts, whichever limit hits first.
    # Without this, 3 attempts x 3s connect + 10s read could stall a user for
    # 30+ seconds.
    proxy_next_upstream_timeout 5s;

    # Request body buffering is left at its default (ON) deliberately. Nginx
    # reads the whole body from the client BEFORE it opens a connection to a
    # backend, so a slow client occupies a cheap Nginx connection slot instead
    # of pinning a uvicorn worker for the duration of its dribble. Turning it
    # off would stream the body straight through and hand slowloris a path to
    # the Python processes -- undoing client_body_timeout's whole purpose.
    # (Our bodies are <100 bytes, so buffering costs nothing.)
    # proxy_request_buffering off;   # <- do NOT enable for this app

    # =====================================================================
    # SERVER 1 of 2  --  plain HTTP, redirect only
    # =====================================================================
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # The security snippet is included here too so that even this redirect
        # carries nosniff/CSP/etc. $hsts_header is empty when $scheme is http,
        # so no HSTS is emitted here -- see the map above.
        include /etc/nginx/snippets/security-headers.conf;

        # 301 everything to HTTPS.
        #
        # THE PORT IS THE WHOLE TRICK: in production you would write
        # `https://$host$request_uri` and let :443 be implicit. Here Nginx
        # listens on container :443 but it is published on HOST :8443, and
        # $host does NOT include a port. Without the explicit :8443 the browser
        # would be sent to https://localhost (port 443), where nothing is
        # listening, and the demo dies on step one.
        #
        # 301 (permanent) rather than 302 so browsers cache it -- which is also
        # why this line must be right before anyone loads the page.
        return 301 https://$host:8443$request_uri;
    }

    # =====================================================================
    # SERVER 2 of 2  --  HTTPS, the real gateway
    # =====================================================================
    server {
        # `http2 on;` as its own directive is the modern form (Nginx >= 1.25.1).
        # The old `listen 443 ssl http2;` still parses but is deprecated, which
        # is one reason the image tag is pinned to 1.27.
        #
        # HTTP/2 matters for this app specifically: the seat-map page issues the
        # poll alongside other requests, and HTTP/2 multiplexes them over ONE
        # TCP+TLS connection instead of opening up to 6 per origin.
        listen      443 ssl default_server;
        listen      [::]:443 ssl default_server;
        http2       on;
        server_name _;

        # --- TLS termination ---------------------------------------------
        # TLS ENDS HERE. Everything behind Nginx -- api1/api2/api3, Postgres --
        # speaks plain HTTP/TCP on the private Docker network, which is why the
        # backends are cheap (no per-replica certificate, no TLS CPU cost) and
        # why they must learn the original scheme from X-Forwarded-Proto.
        # In a zero-trust production network you would re-encrypt this hop.
        #
        # The certificate is self-signed and generated at container start by
        # /docker-entrypoint.d/10-gen-cert.sh, so a fresh clone needs no manual
        # step. The browser will warn once; that is expected and is called out
        # in README troubleshooting.
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.2 is the floor. 1.0/1.1 are deprecated and broken; 1.3 cuts the
        # handshake to one round trip, which is why a poll-heavy page feels
        # faster on it.
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Let the CLIENT choose the cipher. Modern clients pick the fastest
        # suite their hardware supports (AES-NI vs ChaCha20); forcing the
        # server's order is 2015 advice that now makes mobile slower.
        ssl_prefer_server_ciphers off;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

        # Session resumption: 10 MB of shared memory (~40k sessions) lets a
        # returning browser skip the full handshake. Without it, every new
        # connection from a polling page pays a full asymmetric handshake.
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1h;
        # Tickets off: they are stateless and convenient but the ticket key
        # undermines forward secrecy unless it is rotated, and we have a
        # session cache anyway.
        ssl_session_tickets off;

        root  /usr/share/nginx/html;
        index index.html;

        # -----------------------------------------------------------------
        # Static frontend
        # -----------------------------------------------------------------
        # Hashed, immutable assets. Vite emits /assets/index-B7xK2q.js, so the
        # filename changes whenever the content changes. That is what makes a
        # one-year cache safe: there is nothing to invalidate, only new names.
        #
        # `immutable` additionally tells the browser not to send a conditional
        # revalidation request on a hard refresh.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            # Re-included because the line above is an add_header: see the
            # inheritance trap documented in the snippet itself.
            include /etc/nginx/snippets/security-headers.conf;

            # Asset hits are ~90% of the request count and 0% of the
            # interesting information. Turning them off keeps the ops
            # dashboard's live table focused on API traffic.
            access_log off;
            try_files $uri =404;
        }

        # index.html must NEVER be cached, or a user who has the page open
        # keeps loading the OLD /assets/index-<oldhash>.js forever after a
        # deploy -- a 404 or a stale app with no way to recover but a hard
        # refresh. `no-cache` means "revalidate every time", not "do not
        # store": the browser still gets a cheap 304 when nothing changed.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # SPA fallback. React Router owns /events/12 and /checkout/<uuid>, but
        # those paths do not exist as files, so a hard refresh or a shared link
        # would 404 without this.
        #
        # try_files: serve the file if it exists, then the directory, otherwise
        # hand /index.html to the browser and let React Router read the URL.
        # This block is deliberately LAST among the static rules and uses the
        # plain `/` prefix, which is the lowest-priority match in Nginx -- so
        # every /api/ and /assets/ rule wins over it.
        location / {
            include /etc/nginx/snippets/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }

        # =================================================================
        # API  --  cached read paths first, then the strict write paths,
        #          then the general fallback.
        #
        # Nginx location precedence (why this ordering works):
        #   1. `location = /exact` wins immediately.
        #   2. the longest `location /prefix` match is remembered.
        #   3. every `location ~ regex` is tried IN FILE ORDER; the first hit
        #      wins and the remembered prefix is discarded.
        #   4. if no regex matched, the remembered prefix is used.
        # So the regexes below outrank `location /api/`, and `= /api/events`
        # outranks everything.
        # =================================================================

        # --- MICROCACHED: the seat map (polled every ~2.5 s per tab) ------
        location ~ ^/api/events/[0-9]+/seats$ {
            limit_req  zone=api_ip burst=40 nodelay;
            limit_conn conn_ip 50;

            proxy_cache       api_cache;
            # 1 second. The most aggressive value that still collapses a poll
            # storm, and the shortest window of staleness the UI can show.
            proxy_cache_valid 200 1s;
            # Only GET/HEAD are ever cached. A POST to this URL (there is none)
            # would pass straight through.
            proxy_cache_methods GET HEAD;

            # *** THE THUNDERING HERD FIX ***
            # Without cache_lock, the instant a 1-second entry expires ALL 400
            # waiting pollers are simultaneously declared cache misses and all
            # 400 are forwarded to the backends at once -- a stampede every
            # second, which is worse than no cache at all. With it, ONE request
            # is allowed through to refill the entry and the rest WAIT for it.
            proxy_cache_lock          on;
            proxy_cache_lock_timeout  2s;

            # Serve the slightly stale copy rather than an error:
            #   updating -> while the single refill request is in flight
            #   error/timeout/502/503 -> while the backends are unhealthy
            # This is what keeps the seat map rendering during the `docker stop
            # api2` demo even in the instant before failover completes.
            proxy_cache_use_stale updating error timeout http_502 http_503;
            # Refresh the entry in the BACKGROUND and return the stale copy
            # immediately, so no user ever waits for a refill.
            proxy_cache_background_update on;

            # HIT / MISS / EXPIRED / UPDATING / STALE / BYPASS. The frontend
            # prints this under the seat map, which is how the microcache is
            # demonstrated live rather than asserted.
            # `always` so it appears on error responses too.
            add_header X-Cache-Status $upstream_cache_status always;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-headers.conf;
            # No trailing slash: the URI reaches the app exactly as the browser
            # sent it, because the app already mounts everything under /api.
            # With a trailing slash, Nginx would strip the matched prefix and
            # the backend would see a path it does not serve.
            proxy_pass http://api_backend;
        }

        # --- MICROCACHED: event list and event detail ---------------------
        # 2 s rather than 1 s: seats_left is the only thing that moves here and
        # the list page is not a live dashboard.
        location = /api/events {
            limit_req  zone=api_ip burst=40 nodelay;
            limit_conn conn_ip 50;

            proxy_cache       api_cache;
            proxy_cache_valid 200 2s;
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale updating error timeout http_502 http_503;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status always;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://api_backend;
        }

        location ~ ^/api/events/[0-9]+$ {
            limit_req  zone=api_ip burst=40 nodelay;
            limit_conn conn_ip 50;

            proxy_cache       api_cache;
            proxy_cache_valid 200 2s;
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 2s;
            proxy_cache_use_stale updating error timeout http_502 http_503;
            proxy_cache_background_update on;

            add_header X-Cache-Status $upstream_cache_status always;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://api_backend;
        }

        # --- BRUTE-FORCE PROTECTED: login and signup ----------------------
        # ~5 requests per MINUTE per IP with a burst of 3. A human mistypes a
        # password three times; a credential-stuffing script does not stop at
        # three. Every attempt costs the server a ~50 ms scrypt hash, so this
        # limit protects CPU as much as it protects accounts.
        #
        # IMPORTANT: api_ip is listed again. limit_req is NOT additive across
        # levels -- a location that declares any limit_req inherits NONE from
        # the parent. Declaring both means a request must satisfy BOTH buckets.
        location = /api/auth/login {
            limit_req  zone=auth_ip burst=3 nodelay;
            limit_req  zone=api_ip  burst=40 nodelay;
            limit_conn conn_ip 50;

            # NOT CACHED. There is no proxy_cache directive here and none is
            # inherited (proxy_cache is only set inside the three locations
            # above), so nothing about auth can ever be stored. Caching a login
            # response would be the single worst bug possible here: one user's
            # JWT handed to the next caller.
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://api_backend;
        }

        location = /api/auth/signup {
            limit_req  zone=auth_ip burst=3 nodelay;
            limit_req  zone=api_ip  burst=40 nodelay;
            limit_conn conn_ip 50;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://api_backend;
        }

        # --- PER-USER LIMITED: holds, confirm, release --------------------
        # A prefix match, so it covers /api/holds, /api/holds/{id},
        # /api/holds/{id}/confirm and the DELETE. One location for the whole
        # booking funnel means the per-user limit cannot be forgotten on one of
        # them.
        #
        # 2 requests/second per TOKEN with burst 5. A real person clicks "Hold
        # seats" once; this stops a script from hammering the contended seat
        # rows in Postgres. Both zones apply: booking_user catches the logged-in
        # abuser, api_ip catches anonymous or token-rotating traffic (remember
        # an empty Authorization header is not counted by booking_user at all).
        #
        # NEVER CACHED: the response depends entirely on who is asking, and a
        # POST is not a cacheable method anyway.
        #
        # AND NEVER RETRIED: proxy_next_upstream (http level) excludes
        # non_idempotent, so a POST that times out here is reported to the user
        # rather than replayed on another replica. See the http-level comment.
        location /api/holds {
            limit_req  zone=booking_user burst=5 nodelay;
            limit_req  zone=api_ip       burst=40 nodelay;
            limit_conn conn_ip 50;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://api_backend;
        }

        # --- /nginx_status ------------------------------------------------
        # Nginx's own counters: active connections, accepted/handled/total
        # requests, and the reading/writing/waiting breakdown. `accepts` minus
        # `handled` is the number of connections Nginx dropped because it hit a
        # limit -- the first number to look at when the site feels slow.
        #
        # PRODUCTION: this must be restricted. It is an unauthenticated window
        # into your traffic volume. Uncomment the allow/deny pair (or put it
        # behind auth_basic / a separate admin port).
        #     allow 10.0.0.0/8;
        #     allow 127.0.0.1;
        #     deny  all;
        # It is left open here only so the ops dashboard can read it in the
        # browser during a screen-shared demo.
        location = /nginx_status {
            stub_status;
            # Self-monitoring must not pollute the log it is monitoring.
            access_log off;
            include /etc/nginx/snippets/security-headers.conf;
        }

        # --- GENERAL API FALLBACK -----------------------------------------
        # Everything else under /api/: /api/auth/me, /api/bookings,
        # /api/admin/*, /api/ops/*, /api/time, /api/docs.
        # Lowest-priority /api match, so it only runs when none of the specific
        # locations above claimed the request.
        #
        # Not cached (no proxy_cache here either), because every one of these
        # either depends on the caller (bookings, me, admin, ops) or must be
        # exact (time -- a cached clock is a wrong clock).
        location /api/ {
            limit_req  zone=api_ip burst=40 nodelay;
            limit_conn conn_ip 50;
            include /etc/nginx/snippets/security-headers.conf;
            include /etc/nginx/snippets/proxy-headers.conf;
            proxy_pass http://api_backend;
        }

        # =================================================================
        # Error pages
        # =================================================================
        # Turn Nginx's own HTML error pages into the SAME JSON envelope the API
        # uses, so the frontend has exactly one error parser:
        #   {"error": {"code": "...", "message": "..."}}
        # Without this, a 429 from the edge arrives as an HTML page, the
        # frontend's response.json() throws, and the user sees "something went
        # wrong" instead of "too many requests, slow down".
        error_page 429 = @rate_limited;
        error_page 413 = @too_large;
        error_page 502 503 504 = @upstream_down;

        location @rate_limited {
            default_type application/json;
            # Retry-After is the machine-readable "come back in N seconds".
            # The frontend reads it to time its toast instead of guessing.
            add_header Retry-After 1 always;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            return 429 '{"error":{"code":"rate_limited","message":"Too many requests, please slow down","retry_after":1}}';
        }

        location @too_large {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            return 413 '{"error":{"code":"payload_too_large","message":"Request body exceeds the 64 KB limit"}}';
        }

        # Reached only when EVERY upstream attempt failed -- i.e. all three
        # replicas are unreachable, not just one. A single dead replica is
        # invisible to the user because proxy_next_upstream already retried it
        # elsewhere.
        location @upstream_down {
            default_type application/json;
            add_header Retry-After 5 always;
            add_header Cache-Control "no-store" always;
            include /etc/nginx/snippets/security-headers.conf;
            return 503 '{"error":{"code":"upstream_unavailable","message":"The booking service is temporarily unavailable"}}';
        }
    }
}
