# ===========================================================================
# snippets/proxy-headers.conf
# Included by EVERY location that proxies to the API. One file so that no
# location can accidentally forward a different set of headers than the others.
# ===========================================================================

# --- Upstream keepalive -----------------------------------------------------
# These two lines are what make `keepalive 32` in the upstream block actually
# work, and they are the single most commonly missed pair in an Nginx config.
#
# By default Nginx talks to upstreams with HTTP/1.0 and sends
# `Connection: close`, so every single proxied request opens a brand-new TCP
# connection to a backend and closes it afterwards. During a flash sale that is
# thousands of TCP handshakes per second and a pile of sockets stuck in
# TIME_WAIT on both sides.
#
# WHAT BREAKS WITHOUT THEM: the upstream `keepalive 32` pool is silently never
# used. Nothing errors -- you just quietly pay a handshake per request and
# eventually run out of ephemeral ports under load.
proxy_http_version 1.1;
proxy_set_header Connection "";

# --- Who was the real client? -----------------------------------------------
# The backend sees Nginx's container IP as $remote_addr, so without these the
# app (and its logs) would think every request came from the proxy.
#
# Host: pass the browser's Host through unchanged, so the app can build correct
#   absolute URLs and so a virtual-hosted upstream routes properly. Using
#   $proxy_host instead would rewrite it to "api_backend", which is wrong.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Appends our $remote_addr to any existing chain, so a request that passed
# through another proxy keeps its history.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# TLS stops at Nginx; the backends speak plain HTTP on the private Docker
# network. This header is how the app knows the user's connection was HTTPS
# (needed for building https:// links and for "secure cookie" decisions).
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# --- Timeouts ---------------------------------------------------------------
# Without these, Nginx's defaults are 60s read/send: one stuck backend would
# tie up a worker connection for a full minute per request, and a flash sale
# would exhaust worker_connections while the user stared at a spinner.
#
# connect: how long to wait for the TCP handshake to a backend. Short on
#   purpose -- on a local network a backend either answers in milliseconds or
#   it is down, and a fast failure is what lets proxy_next_upstream move on to
#   a healthy replica quickly.
proxy_connect_timeout 3s;
# send: how long a single write of the request body to the backend may stall.
proxy_send_timeout    10s;
# read: how long between two successive reads from the backend. This is the
#   one that protects against a backend that accepted the connection and then
#   hung (e.g. blocked on a database lock). 10s is comfortably above our
#   slowest real query and well below a user's patience.
proxy_read_timeout    10s;

# --- Demo visibility --------------------------------------------------------
# DEMO ONLY -- REMOVE IN PRODUCTION.
# $upstream_addr is which backend actually served the request (and, after a
# retry, a comma-separated list of everything that was tried). It is what makes
# the load balancing and the failover visible in the ops dashboard and in curl.
# In production this leaks internal topology -- private IPs, port numbers and
# the replica count -- straight to anyone with a browser. Delete this line.
add_header X-Upstream $upstream_addr always;
