# ===========================================================================
# snippets/security-headers.conf
#
# *** THE add_header INHERITANCE TRAP ***
# Nginx's add_header is NOT additive across configuration levels. Rules:
#   - a location with NO add_header of its own inherits the whole set from its
#     server/http block;
#   - a location that defines EVEN ONE add_header inherits NONE of them.
# So the moment a location adds `X-Cache-Status`, it silently loses every
# security header the server block was adding. The headers do not merge --
# the nearest level with any add_header wins outright.
#
# That is why this file exists and why EVERY location in nginx.conf includes
# it explicitly, even locations that look like they would inherit. It is cheap
# insurance against a header quietly disappearing when someone later adds a
# debug header to one location.
#
# `always` means "send this header even on error responses" (4xx/5xx). Without
# it, a 429 or a 502 would come back with no security headers at all -- and
# error pages are exactly the responses an attacker is most likely to see.
# ===========================================================================

# Stops the browser from guessing a response is HTML/JS when the declared
# Content-Type says otherwise. Without it, a JSON endpoint that echoes
# attacker-controlled text can be sniffed as HTML and execute as a page.
add_header X-Content-Type-Options nosniff always;

# No one may frame SeatRush. Without it, a lookalike page could iframe the real
# seat map invisibly and trick a logged-in user into clicking "Pay"
# (clickjacking). DENY is stricter than SAMEORIGIN and we never self-frame.
add_header X-Frame-Options DENY always;

# Send the full URL as Referer only to our own origin; cross-origin requests
# get just the scheme+host. Stops a hold id or booking code in a URL from
# leaking to a third-party site via the Referer header.
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Browsers have no business asking for the camera/mic/geolocation here.
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

# --- Content Security Policy ------------------------------------------------
# Same-origin only, which is possible precisely because this app has no CDN,
# no external fonts and no third-party analytics: Nginx serves the React bundle
# and proxies /api from one origin.
#
#   default-src 'self'   -> everything defaults to our own origin
#   script-src  'self'   -> NO inline <script> and no eval. A Vite production
#                           build emits an external module script, so this
#                           works; `npm run dev` would need 'unsafe-inline'
#                           for its HMR client, which is why dev is proxied
#                           through Vite rather than through Nginx.
#   style-src   'self'   -> external stylesheet only. React's style={{...}}
#                           props are unaffected: React writes them through the
#                           CSSOM (element.style), which CSP does not police --
#                           only literal style="" attributes in markup.
#   img-src     'self' data: -> data: is needed for the inline favicon/SVGs.
#   connect-src 'self'   -> fetch/XHR may only talk to our own origin, so an
#                           injected script cannot exfiltrate a JWT.
#   frame-ancestors 'none' -> the CSP-era replacement for X-Frame-Options.
#   base-uri / form-action 'self' -> stops <base href> hijacking and stops a
#                           form being re-pointed at an attacker's server.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# --- HSTS, but only over HTTPS ---------------------------------------------
# HSTS tells the browser "never speak plain HTTP to this host again", and the
# browser REMEMBERS it. That is why it must never be sent over plain HTTP (the
# spec says to ignore it there, but belt and braces) and why it is dangerous on
# localhost: a long max-age would pin *every* future project you run on
# localhost to HTTPS, including ones with no certificate, and the only cure is
# digging into chrome://net-internals/#hsts.
#
# So: max-age is deliberately 300 seconds here (production would be a year with
# includeSubDomains and preload), and the value comes from $hsts_header, a map
# in nginx.conf that is empty unless $scheme is https. Nginx skips an
# add_header whose variable value is an empty string, so this single shared
# snippet can be included in the plain-HTTP server block too without leaking
# HSTS over HTTP.
add_header Strict-Transport-Security $hsts_header always;
